# Academic genealogy — drawn as a 9-stage CMOS ring oscillator on /genealogy/.
#
# Order matters: top of the schematic (X1) first. The first and last entries
# are the same person; the last one only marks where the loop closes, so the
# ring has 9 stages (X1–X9).
#
# Fields
#   name, institution, role   shown on each card
#   direction                 up = MS lineage ("advisor of"), apex = common
#                             ancestor, down = PhD lineage ("student of")
#   degree_year               optional, e.g. "Ph.D. 1969"
#   phd_institution           optional, where they earned their Ph.D.
#   link                      optional, e.g. IEEE Xplore author page. Clicking
#                             the stage box or the name on the card opens it.
#   deeper                    optional, page that continues this person's lineage
#                             (shown as a "Deeper" button on the stage and card)
#   photo                     optional. Leave empty to auto-detect
#                             images/Academic_Genealogy/First_Last.(jpg|jpeg|png)
#                             (middle initials dropped). Set a path to override.
# Empty optional fields are hidden.

